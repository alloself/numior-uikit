packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - esbuild

# Vue's SFC compiler needs the TypeScript JS compiler API, including ts.sys.
# Prevent optional peer auto-installation from selecting the native TS 7 package.
overrides:
  typescript: 5.9.3
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  '@vitest/coverage-v8': 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
