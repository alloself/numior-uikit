name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never interrupt a package publication halfway through the workspace.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm check:ci
      - uses: actions/cache/save@v6
        if: success()
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch'
        with:
          name: docs-site-${{ github.sha }}
          path: apps/docs/.vitepress/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [quality]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && vars.NUMIOR_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      NUMIOR_RELEASE_ENABLED: ${{ vars.NUMIOR_RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: pnpm build
      - run: pnpm test:artifacts
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional bootstrap credential; configured npm Trusted Publishers use OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-packages-${{ github.sha }}
          path: .release/*.tgz
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  docs:
    needs: [quality, release]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      needs.quality.result == 'success' &&
      needs.release.result != 'failure' &&
      needs.release.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
      url: https://ui.numior.ru/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-${{ github.sha }}
          path: site
      - name: Upload to the docs host
        env:
          DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          DOCS_KNOWN_HOSTS: ${{ vars.DOCS_KNOWN_HOSTS }}
          DOCS_HOST: ${{ vars.DOCS_SSH_HOST }}
          DOCS_USER: ${{ vars.DOCS_SSH_USER }}
          DOCS_PATH: ${{ vars.DOCS_SSH_PATH }}
        run: |
          for name in DOCS_SSH_KEY DOCS_KNOWN_HOSTS DOCS_HOST DOCS_USER DOCS_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          test -f site/index.html
          test -f site/.htaccess
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DOCS_SSH_KEY" > ~/.ssh/docs_deploy
          chmod 600 ~/.ssh/docs_deploy
          printf '%s\n' "$DOCS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync --archive --compress --checksum --delete --delay-updates --exclude=/.well-known/ \
            -e "ssh -i $HOME/.ssh/docs_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            site/ "$DOCS_USER@$DOCS_HOST:$DOCS_PATH/"
